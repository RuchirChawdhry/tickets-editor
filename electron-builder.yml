appId: io.github.ruchirchawdhry.ticketseditor
productName: TicketsEditor
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Utility
mac:
  target:
    - dmg
    - zip
