name: Tagged desktop release

# A version tag triggers native packaging, then one GitHub Release.
# Ordinary branch pushes and pull requests never publish packages.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package without moving it'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tickets-editor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate release source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Ensure the release tag matches package.json
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const { version } = require('./package.json')
          const tag = process.env.RELEASE_TAG
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== 'v' + version) {
            console.error('Release tag ' + tag + ' must equal package.json version v' + version)
            process.exit(1)
          }
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build bundles
        run: npm run build

  package:
    name: Package ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            targets: nsis msi
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            targets: AppImage deb
          - runner: macos-15-intel
            platform: mac
            arch: x64
            targets: dmg zip
          - runner: macos-15
            platform: mac
            arch: arm64
            targets: dmg zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies on the target OS/CPU
        run: npm ci --no-audit --no-fund
      - name: Build Electron and MCP bundles
        run: npm run build
      - name: Prepare Windows application icon for WiX/MSI
        if: matrix.platform == 'win'
        shell: bash
        run: |
          # electron-builder 26 MSI requires an explicit icon. Without one,
          # WiX fails with LGHT0094 (missing TicketsEditorIcon.exe).
          # Build a deterministic multi-resolution ICO using Python stdlib.
          python - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          def pixels(size):
              for y in range(size):
                  row = []
                  for x in range(size):
                      nx, ny = x / size, y / size
                      glyph = (
                          0.21 <= nx < 0.79 and 0.24 <= ny < 0.37
                      ) or (
                          0.44 <= nx < 0.56 and 0.30 <= ny < 0.79
                      )
                      row.append((255, 255, 255, 255) if glyph else (64, 121, 189, 255))
                  yield row

          def dib(size):
              rgba_rows = list(pixels(size))
              bitmap = b''.join(
                  bytes((b, g, r, a)) for row in reversed(rgba_rows) for r, g, b, a in row
              )
              mask = b'\0' * ((size + 31) // 32 * 4 * size)
              header = struct.pack(
                  '<IiiHHIIiiII', 40, size, size * 2, 1, 32, 0, len(bitmap), 0, 0, 0, 0
              )
              return header + bitmap + mask

          def chunk(kind, payload):
              return (
                  struct.pack('>I', len(payload)) + kind + payload
                  + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
              )

          def png(size):
              raw = b''.join(b'\0' + b''.join(bytes(pixel) for pixel in row) for row in pixels(size))
              return (
                  b'\x89PNG\r\n\x1a\n'
                  + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0))
                  + chunk(b'IDAT', zlib.compress(raw, 9))
                  + chunk(b'IEND', b'')
              )

          images = [(16, dib(16)), (32, dib(32)), (48, dib(48)), (256, png(256))]
          header = struct.pack('<HHH', 0, 1, len(images))
          offset = len(header) + 16 * len(images)
          for size, picture in images:
              header += struct.pack('<BBBBHHII', size % 256, size % 256, 0, 0, 1, 32, len(picture), offset)
              offset += len(picture)
          Path('build').mkdir(exist_ok=True)
          icon = Path('build/release-icon.ico')
          icon.write_bytes(header + b''.join(picture for _, picture in images))
          print(f'Wrote {icon} ({icon.stat().st_size:,} bytes)')
          PY

      - name: Build installers (no implicit release uploads)
        shell: bash
        env:
          # Signing identities have not been configured yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          args=(--${{ matrix.platform }})
          read -r -a targets <<< "${{ matrix.targets }}"
          args+=("${targets[@]}" --${{ matrix.arch }} --publish never)
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=("-c.win.icon=build/release-icon.ico")
          fi
          npx electron-builder "${args[@]}"
      - name: Confirm expected packages exist
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('package.json').read_text())['version']
          platform = os.environ['TARGET_PLATFORM']
          arch = os.environ['TARGET_ARCH']
          suffixes = {
              ('win', 'x64'): ['win-x64.exe', 'win-x64.msi'],
              ('linux', 'x64'): ['linux-x86_64.AppImage', 'linux-amd64.deb'],
              ('mac', 'x64'): ['mac-x64.dmg', 'mac-x64.zip'],
              ('mac', 'arm64'): ['mac-arm64.dmg', 'mac-arm64.zip'],
          }
          for suffix in suffixes[(platform, arch)]:
              artifact = Path('dist') / f'TicketsEditor-{version}-{suffix}'
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty installer: {artifact}')
              print(f'{artifact}: {artifact.stat().st_size:,} bytes')
          PY
      - name: Upload installers for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: tickets-editor-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all native build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tickets-editor-*
          merge-multiple: true
          path: release-assets
      - name: Verify the complete set and create SHA256SUMS.txt
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'][1:]
          suffixes = [
              'win-x64.exe', 'win-x64.msi',
              'linux-x86_64.AppImage', 'linux-amd64.deb',
              'mac-x64.dmg', 'mac-x64.zip',
              'mac-arm64.dmg', 'mac-arm64.zip',
          ]
          expected = {f'TicketsEditor-{version}-{suffix}' for suffix in suffixes}
          folder = Path('release-assets')
          actual = {file.name for file in folder.iterdir() if file.is_file()}
          if expected != actual:
              raise SystemExit(f'Release assets mismatch; missing={sorted(expected - actual)}; extra={sorted(actual - expected)}')
          with (folder / 'SHA256SUMS.txt').open('w', encoding='utf-8') as checksums:
              for name in sorted(expected):
                  file = folder / name
                  with file.open('rb') as contents:
                      digest = hashlib.file_digest(contents, 'sha256').hexdigest()
                  checksums.write(f'{digest}  {name}\n')
          print(f'Validated {len(expected)} installers and created SHA256SUMS.txt')
          PY
      - name: Publish release only after every native build succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TicketsEditor $RELEASE_TAG" \
            --generate-notes \
            ${args[@]}
