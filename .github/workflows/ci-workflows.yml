name: ci-workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cross-platform source checks (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Oxlint (optional fast pass)
        run: npm run lint:fast
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rebuild native SQLite dependency for Node.js unit tests
        run: npm rebuild better-sqlite3 --no-audit --no-fund
      - name: Unit tests and SQLite round trips
        run: npm test
      - name: Build application bundles
        run: npm run build
