name: Publish v0.6.0 tag (one-shot)

# The token's tag push cannot trigger push-based workflows. Dispatch the
# existing native release pipeline explicitly after creating an immutable tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: "github.repository == 'RuchirChawdhry/tickets-editor' && github.event.head_commit.message == 'ci: dispatch v0.6.0 release'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version source, successful CI and absent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_SHA: '29dd144f2682972c3c821fc9ce6d232fdf2a55fa'
          SOURCE_CI_RUN: '45085680625'
        run: |
          set -euo pipefail
          git cat-file -e "$VERSION_SHA^{commit}"
          expected_version="$(git show "$VERSION_SHA:package.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>console.log(JSON.parse(s).version))')"
          if [[ "$expected_version" != "0.6.0" ]]; then
            echo "Unexpected source version: $expected_version"
            exit 1
          fi
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN" --jq .head_sha)"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN" --jq .conclusion)"
          if [[ "$conclusion" != "success" || "$source_sha" != "$VERSION_SHA" ]]; then
            echo "Source CI is not successful for the expected immutable commit"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.6.0 >/dev/null 2>&1; then
            echo "Tag v0.6.0 already exists; refusing to overwrite it"
            exit 1
          fi
      - name: Create annotated v0.6.0 tag on tested commit
        shell: bash
        env:
          VERSION_SHA: '29dd144f2682972c3c821fc9ce6d232fdf2a55fa'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.6.0 "$VERSION_SHA" -m 'TicketsEditor v0.6.0'
          git push origin refs/tags/v0.6.0
      - name: Dispatch tagged native release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag=v0.6.0
