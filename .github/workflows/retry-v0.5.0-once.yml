name: Retry v0.5.0 release (one-shot)
on:
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  dispatch:
    if: "github.repository == 'RuchirChawdhry/tickets-editor' && github.event.head_commit.message == 'ci: retry v0.5.0 release'"
    runs-on: ubuntu-24.04
    steps:
      - name: Start release workflow for immutable v0.5.0 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag=v0.5.0
