name: Publish v0.5.0 tag (one-shot)

# Temporary one-shot: publish the already-tested version commit as a normal release.
# The workflow is deleted from main after it runs.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.repository == 'RuchirChawdhry/tickets-editor' && github.event.head_commit.message == 'ci: dispatch v0.5.0 release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable version commit and successful source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 94d3ba5b93260d11cfd2e732a8e3f59cbae4117c
          CI_RUN: '45069495648'
        run: |
          set -euo pipefail
          actual_version="$(git show "$RELEASE_SHA:package.json" | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk).on("end",()=>console.log(JSON.parse(text).version))')"
          if [[ "$actual_version" != "0.5.0" ]]; then
            echo "Unexpected version: $actual_version"
            exit 1
          fi
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Source CI did not pass: $conclusion"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            echo 'Tag v0.5.0 already exists. Refusing to overwrite it.'
            exit 1
          fi
      - name: Push annotated v0.5.0 tag
        shell: bash
        env:
          RELEASE_SHA: 94d3ba5b93260d11cfd2e732a8e3f59cbae4117c
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.5.0 "$RELEASE_SHA" -m 'TicketsEditor v0.5.0'
          git push origin refs/tags/v0.5.0
      - name: Trigger native release packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN tag pushes do not trigger push-based workflows.
          # workflow_dispatch is an explicitly supported exception.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.5.0
