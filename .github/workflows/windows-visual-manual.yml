name: Windows visual review (manual)

# Manual dispatch or an explicitly created visual-review ref only.
# Ordinary main pushes and pull requests never trigger this workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-visual-*'
    branches:
      - 'windows-visual-*'

concurrency:
  group: windows-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-visual:
    name: Electron screenshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install WinApp CLI for native HWND capture
        uses: microsoft/setup-WinAppCli@v0.3

      - name: Verify Windows capture tool
        run: winapp --version

      - name: Build Electron app
        run: npm run build

      - name: Capture and check Windows GUI
        run: npm run test:visual:windows
        env:
          CI: 'true'

      - name: Upload Windows screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickets-editor-windows-visual-${{ github.run_number }}
          path: artifacts/windows-visual/
          if-no-files-found: warn
          retention-days: 14
